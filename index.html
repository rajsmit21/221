  grid.innerHTML=list.map(x=>`<div class="card ${x.isOverallLow?"low":""}">
    <div class="top"><div><div class="meta">Roll #${x.sr} • ${x.enroll} • Rank #${x.rank}</div><div class="name">${x.name}</div></div>
    <div class="pct ${x.isOverallLow?"bad":"ok"}">${x.overall.toFixed(2)}%<div style="font-size:.68rem">${x.isOverallLow?"≤75% LOW":">75% SAFE"}</div></div></div>
    <table><thead><tr><th>Type</th><th>RS</th><th>KS</th><th>SA1</th><th>SN&AI</th><th>PV</th></tr></thead>
    <tbody>
      <tr><td><b>Theory</b></td>${[0,2,4,6,8].map(i=>`<td class="${x.avgs[i]<=75?"bad":""}">${x.avgs[i]}%</td>`).join("")}</tr>
      <tr><td><b>NLHT+P</b></td>${[1,3,5,7,9].map(i=>`<td class="${x.avgs[i]<=75?"bad":""}">${x.avgs[i]}%</td>`).join("")}</tr>
    </tbody></table>
    <div class="note" style="color:${x.isRecoveryNeeded?"#fda4af":"#6ee7b7"}">${x.recoveryText}</div>
  </div>`).join("");
}
q.addEventListener("input",draw);
document.querySelectorAll(".pill").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));b.classList.add("active");f=b.dataset.f;draw();
}));
draw();
</script>
